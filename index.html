<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chris Shopper — Instant SMS Verification & Virtual Phone Numbers</title>
    <meta name="description" content="Get instant non-VoIP US and global phone numbers for SMS verification on Telegram, WhatsApp, OpenAI, Google, Apple, and 120+ platforms with 99.9% delivery SLA." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background:radial-gradient(circle at 50% 45%, #0c1630 0%, #060b19 60%, #03050c 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;z-index:999999;padding:16px;">
        <div style="width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);display:grid;place-items:center;box-shadow:0 0 30px rgba(56,189,248,0.3);margin-bottom:18px;">
          <img src="/logo.svg" alt="Chris Shopper" style="width:44px;height:44px;object-fit:contain;" />
        </div>
        <div style="font-size:clamp(1.6rem, 6vw, 2.4rem);font-weight:800;letter-spacing:-0.02em;margin-bottom:14px;display:flex;align-items:center;">
          <span>Chris&nbsp;</span><span style="background:linear-gradient(135deg, #38bdf8, #a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Shopper</span>
        </div>
        <div style="width:120px;height:3px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:50%;background:linear-gradient(90deg, transparent, #38bdf8, #a855f7, transparent);animation:csInitialPulse 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
      <style>
        @keyframes csInitialPulse {
          0% { left: -50%; width: 40%; }
          100% { left: 110%; width: 40%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
